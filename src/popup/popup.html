<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ratings for Netflix</title>
  <style>
    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #141414;
      color: #e5e5e5;
      margin: 0;
      padding: 16px;
    }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p { font-size: 12px; color: #ccc; margin: 4px 0; }
    button {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      border: none;
      border-radius: 4px;
      background: #333;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: #444; }
    .disclaimer { color: #777; font-size: 10px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Ratings for Netflix</h1>
  <p id="status">Loading…</p>
  <button id="open-options">Options</button>
  <button id="open-setup">Rebuild index</button>
  <p class="disclaimer">Not affiliated with Netflix or IMDb.</p>
  <script type="module" src="popup.js"></script>
</body>
</html>
